global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-ser:8000']

  - job_name: 'task-service'
    static_configs:
      - targets: ['task-ser:8000']

  - job_name: 'order-service'
    static_configs:
      - targets: ['ord-ser:8000']
