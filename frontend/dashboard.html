<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="dashboard">

  <aside class="sidebar">
    <h2>Healthcare</h2>

    <ul>
      <li onclick="showSection('tasks-section')">Appointments</li>
      <li onclick="showSection('orders-section')">Medicine Orders</li>
      <li onclick="logoutUser()">Logout</li>
    </ul>
  </aside>

  <main class="main-content">

    <div class="topbar">
      <h1>Patient Dashboard</h1>
      <p>Welcome to Smart Healthcare Portal</p>
    </div>

    <section id="tasks-section" class="card-section">

      <h2>Appointments & Health Tasks</h2>

      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Book appointment or add health task"/>
        <button onclick="addTask()">Add</button>
      </div>

      <ul id="taskList"></ul>

    </section>

    <section id="orders-section" class="card-section hidden">

      <h2>Medicine & Lab Orders</h2>

      <div class="input-row">
        <input type="text" id="orderInput" placeholder="Request medicine or lab service"/>
        <button onclick="placeOrder()">Place Order</button>
      </div>

      <ul id="orderList"></ul>

    </section>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
