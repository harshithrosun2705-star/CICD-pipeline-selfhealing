<!DOCTYPE html>
<html>
<head>
  <title>DevOps Cloud Platform - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <h1>DevOps Cloud Platform</h1>
    <p class="subtitle">CI/CD • Microservices • Monitoring</p>

    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>
    <button class="secondary-btn" onclick="register()">Register</button>

    <p class="note">Powered by Jenkins, Docker, AWS, Prometheus & Grafana</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
